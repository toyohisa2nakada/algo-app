<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Research for Algo Game</title>
  <!-- <script src="https://cdn.tailwindcss.com"></script> -->
  <link rel="stylesheet" href="./style.css">
</head>

<body class="bg-stone-100 overflow-hidden fixed w-full h-full flex flex-row [touch-action:none]">

  <!-- 優勢度 -->
  <div class="flex flex-col items-center gap-2">
    <div>AI</div>
    <div class="w-1/2 h-[30vh] flex flex-col rounded-full">
      <div class="bg-red-500 w-full transition-all duration-500 flex items-center justify-center text-ms ai-advantage"
        style="height: 50%"></div>
      <div class="bg-blue-500 w-full flex-1 flex items-center justify-center text-ms human-advantage"></div>
    </div>
    <div>Player</div>
    <!-- <div class="ml-auto">v1</div> -->
  </div>

  <div
    class="flex flex-col justify-between h-[40vh] w-full py-[env(safe-area-inset-top)_0_env(safe-area-inset-bottom)_0]">

    <!-- 相手の手札エリア -->
    <div id="enemy-hand-ui"
      class="hand-area relative h-[90px] w-full bg-black/[0.03] overflow-x-auto overflow-y-hidden whitespace-nowrap [-webkit-overflow-scrolling:touch] [scrollbar-width:none]">
      <div id="enemy-hand-inner" class="relative min-w-full h-full"></div>
    </div>

    <!-- 中央エリア（デッキ・未確定カード・コントロール） -->
    <div class="relative flex justify-center items-center gap-5 h-[100px] w-4/5">

      <!-- 未確定カードのスポット -->
      <div id="unsettled-spot"
        class="absolute left-[5%] w-[var(--card-w)] h-[var(--card-h)] border-2 border-dashed border-gray-300 rounded-[5px]">
      </div>

      <!-- デッキ -->
      <div id="deck-btn" class="absolute left-1/4 w-[var(--card-w)] h-[var(--card-h)] cursor-pointer">
      </div>

      <!-- アクションコントロール -->
      <div id="action-controls"
        class="hidden absolute right-[5%] top-1/2 -translate-y-1/2 flex flex-col items-center gap-2">
        <div class="flex gap-2 bg-white p-2 rounded-xl shadow-lg border-2 border-amber-500">
          <input type="number" id="guess-input" inputmode="numeric"
            class="w-10 p-1 rounded border-2 border-gray-300 text-center font-bold text-lg" placeholder="?">
          <button id="attack-btn" class="px-3 py-1.5 rounded-full font-bold text-xs bg-amber-500 text-white">
            ATTACK
          </button>
        </div>
        <button id="stay-btn" class="hidden px-3 py-1.5 rounded-full font-bold text-xs bg-stone-700 text-white">
          STAY
        </button>
      </div>

      <!-- ログ -->
      <div id="log"
        class="ml-auto text-xs px-4 text-center font-bold h-8 flex items-center justify-center text-stone-600 italic">
        山札をタップ
      </div>
    </div>

    <!-- プレイヤーの手札エリア -->
    <div id="player-hand-ui"
      class="hand-area relative h-[90px] w-full bg-black/[0.03] overflow-x-auto overflow-y-hidden whitespace-nowrap [-webkit-overflow-scrolling:touch] [scrollbar-width:none]">
      <div id="player-hand-inner" class="relative min-w-full h-full"></div>
    </div>
  </div>

  <script type="module">
    import { next_ai, init_game, getAdvantages } from "./algo-ai.js";

    let deck = undefined;
    let playerHand = [];
    let enemyHand = [];
    let unsettledCard = null;
    let phase = 'INIT';
    let turn = 'player';
    let targetCard = null;
    let dealerCards = [];

    let isDragging = false;
    let dragOffset = { x: 0, y: 0 };
    let currentDragEl = null;

    const UI = {
      log: document.getElementById('log'),
      deckBtn: document.getElementById('deck-btn'),
      playerArea: document.getElementById('player-hand-ui'),
      playerInner: document.getElementById('player-hand-inner'),
      enemyArea: document.getElementById('enemy-hand-ui'),
      enemyInner: document.getElementById('enemy-hand-inner'),
      controls: document.getElementById('action-controls'),
      attackBtn: document.getElementById('attack-btn'),
      stayBtn: document.getElementById('stay-btn'),
      guessInput: document.getElementById('guess-input'),
      spot: document.getElementById('unsettled-spot'),
      ai_advantage: document.querySelector(".ai-advantage"),
      human_advantage: document.querySelector(".human-advantage"),
    };

    function adjustCardSizes() {
      const screenWidth = window.innerWidth;
      const cardW = Math.min(40, Math.floor(screenWidth / 8.5));
      const cardH = Math.floor(cardW * 1.5);
      document.documentElement.style.setProperty('--card-w', `${cardW}px`);
      document.documentElement.style.setProperty('--card-h', `${cardH}px`);
    }

    function updateAdvantages() {
      const state = {
        currentPlayerId: null,
        currentEnemyId: null,
        playerHands: { [1]: playerHand, [-1]: enemyHand },
        deck: deck.deck(),
      };
      const advantages = getAdvantages(state);
      UI.ai_advantage.style.height = `${Math.round(advantages[-1] * 100 / advantages.sum)}%`;
      UI.ai_advantage.textContent = advantages[-1];
      UI.human_advantage.textContent = advantages[1];
    }

    function createDeck() {
      const d = [];
      ['black', 'white'].forEach(color => {
        for (let i = 0; i <= 11; i++) d.push({ id: `${color}-${i}`, number: i, color, isFaceUp: false });
      });
      return {
        pop: function () { return this._deck.pop() },
        get length() { return this._deck.length },
        get: function (i) { return this._deck[i] },
        deck: function () { return this._deck },
        _deck: d.sort(() => Math.random() - 0.5),
      };
    }

    function updateDeckVisual() {
      UI.deckBtn.innerHTML = '';
      const visibleCount = Math.min(deck.length, 5);
      for (let i = 0; i < visibleCount; i++) {
        const layer = document.createElement('div');
        layer.className = `deck-layer ${deck.get(deck.length - 1 - i).color}`;
        layer.style.transform = `translate(${i * 1.5}px, ${i * -1.5}px)`;
        layer.style.zIndex = visibleCount - i;
        UI.deckBtn.appendChild(layer);
      }
    }

    function sortHand(hand) {
      return hand.sort((a, b) => {
        let res = 0;
        if (a.number !== b.number) res = a.number - b.number;
        else res = (a.color === 'black' ? -1 : 1);
        return res;
      });
    }

    function getSortIndex(hand, newCard, isPlayer) {
      let temp = [...hand, newCard];
      sortHand(temp);
      return isPlayer ? temp.indexOf(newCard) : temp.length - temp.indexOf(newCard) - 1;
    }

    // 手札の並びやカードの表裏、および新しく引いたカードの隙間確保などのUI表示を最新の状態に更新する
    function updateHandUI(options = { enemyReverse: true }) {
      const baseCardW = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--card-w'));
      const gap = 6;

      const pCount = playerHand.length + (options.playerOffset ? 1 : 0);
      const pTotalWidth = pCount * (baseCardW + gap);
      UI.playerInner.style.width = `${Math.max(window.innerWidth, pTotalWidth + 40)}px`;

      playerHand.forEach((card, idx) => {
        const el = getCardEl(card, UI.playerInner);
        let offset = (options.playerOffset && idx >= options.playerOffsetIdx) ? (baseCardW + gap) : 0;
        el.style.left = `${20 + (idx * (baseCardW + gap)) + offset}px`;
        el.style.top = '12px';
        el.classList.add('temp-reveal');
        card.isFaceUp ? el.classList.add('is-flipped') : el.classList.remove('is-flipped');
      });

      const eCount = enemyHand.length + (options.enemyOffset ? 1 : 0);
      const eTotalWidth = eCount * (baseCardW + gap);
      UI.enemyInner.style.width = `${Math.max(window.innerWidth, eTotalWidth + 40)}px`;

      (options.enemyReverse ? [...enemyHand].reverse() : enemyHand).forEach((card, idx) => {
        const el = getCardEl(card, UI.enemyInner);
        let offset = (options.enemyOffset && idx >= options.enemyOffsetIdx) ? (baseCardW + gap) : 0;
        el.style.left = `${20 + (idx * (baseCardW + gap)) + offset}px`;
        el.style.top = '12px';
        el.classList.remove('temp-reveal');
        card.isFaceUp ? el.classList.add('is-flipped') : el.classList.remove('is-flipped');
      });

      if (unsettledCard && !isDragging && !options.isSettling) {
        const uEl = getCardEl(unsettledCard, document.body);
        if (phase === 'DRAWN') {
          const spotRect = UI.spot.getBoundingClientRect();
          uEl.style.left = `${spotRect.left}px`;
          uEl.style.top = `${spotRect.top}px`;
        }
        if (turn === "player") uEl.classList.add('temp-reveal');
        unsettledCard.isFaceUp ? uEl.classList.add('is-flipped') : uEl.classList.remove('is-flipped');
      }
    }

    function getCardEl(card, area) {
      let el = document.getElementById(card.id);
      if (!el) {
        el = document.createElement('div');
        el.id = card.id;
        el.className = `card ${card.color}`;

        // カードの表裏 HTML（Tailwind クラスで記述）
        el.innerHTML = `
                <div class="card-inner relative w-full h-full pointer-events-none">
                    <div class="card-front absolute w-full h-full flex items-center justify-center text-[1.1rem] font-bold rounded-[5px] shadow-[0_2px_4px_rgba(0,0,0,0.1)] border border-black/10
                        ${card.color === 'white' ? 'bg-white text-[#1a1a1a]' : 'bg-[#1a1a1a] text-white'}">
                        ${card.number}
                    </div>
                    <div class="card-back absolute w-full h-full flex items-center justify-center text-[1.1rem] font-bold rounded-[5px] shadow-[0_2px_4px_rgba(0,0,0,0.1)]
                        ${card.color === 'white' ? 'bg-gray-100 border border-gray-300' : 'bg-gray-700 border border-gray-900'}">
                        <div class="peek-num hidden">${card.number}</div>
                    </div>
                </div>`;

        el.onmousedown = (e) => handleStart(e.clientX, e.clientY, card);
        el.addEventListener('touchstart', (e) => {
          if (e.touches.length > 1) return;
          if (phase === 'DRAWN' && turn === 'player' && card === unsettledCard) {
            e.preventDefault();
            handleStart(e.touches[0].clientX, e.touches[0].clientY, card);
          }
        }, { passive: false });
        area.appendChild(el);
      }
      if (el.parentElement !== area && !isDragging) area.appendChild(el);
      return el;
    }

    function handleStart(clientX, clientY, card) {
      if (phase !== 'DRAWN' || turn === 'enemy' || card !== unsettledCard) return;
      UI.stayBtn.classList.add('hidden');
      isDragging = true;
      currentDragEl = document.getElementById(card.id);
      currentDragEl.classList.add('dragging');
      const rect = currentDragEl.getBoundingClientRect();
      dragOffset.x = clientX - rect.left;
      dragOffset.y = clientY - rect.top;
      const onMove = (x, y) => {
        if (!isDragging || !currentDragEl) return;
        currentDragEl.style.left = `${x - dragOffset.x}px`;
        currentDragEl.style.top = `${y - dragOffset.y}px`;
        enemyHand.forEach(c => {
          const cEl = document.getElementById(c.id);
          if (!c.isFaceUp && isOverlapping(currentDragEl, cEl)) cEl.classList.add('target-highlight');
          else cEl.classList.remove('target-highlight');
        });
      };
      const onEnd = () => {
        if (!isDragging) return;
        isDragging = false;
        document.removeEventListener('mousemove', mouseMoveHandler);
        document.removeEventListener('mouseup', endHandler);
        document.removeEventListener('touchmove', touchMoveHandler);
        document.removeEventListener('touchend', endHandler);
        currentDragEl.classList.remove('dragging');
        const hit = enemyHand.find(c => !c.isFaceUp && isOverlapping(currentDragEl, document.getElementById(c.id)));
        if (hit) {
          targetCard = hit;
          phase = 'ATTACKING';
          const tEl = document.getElementById(hit.id);
          const tRect = tEl.getBoundingClientRect();
          currentDragEl.style.left = `${tRect.left}px`;
          currentDragEl.style.top = `${tRect.top + tRect.height + 15}px`;
          UI.log.innerText = "数字を予想してください";
          UI.controls.classList.remove('hidden');
          UI.guessInput.focus();
        } else {
          updateHandUI();
        }
        currentDragEl = null;
      };
      const mouseMoveHandler = (e) => onMove(e.clientX, e.clientY);
      const touchMoveHandler = (e) => { if (e.cancelable) e.preventDefault(); onMove(e.touches[0].clientX, e.touches[0].clientY); };
      const endHandler = () => onEnd();
      document.addEventListener('mousemove', mouseMoveHandler);
      document.addEventListener('mouseup', endHandler);
      document.addEventListener('touchmove', touchMoveHandler, { passive: false });
      document.addEventListener('touchend', endHandler);
    }

    function isOverlapping(el1, el2) {
      const r1 = el1.getBoundingClientRect();
      const r2 = el2.getBoundingClientRect();
      const center1X = r1.left + r1.width / 2;
      const center1Y = r1.top + r1.height / 2;
      return (center1X > r2.left && center1X < r2.right && center1Y > r2.top - 20 && center1Y < r2.bottom + 80);
    }

    async function onDeckClick() {
      if (phase === 'INIT') {
        phase = 'DEALER_WAIT';
        deck = createDeck();
        updateDeckVisual();
        const pCard = deck.pop();
        const pEl = getCardEl(pCard, document.body);
        pEl.style.left = '45%'; pEl.style.top = '20%';
        dealerCards.push({ data: pCard, el: pEl });
        await wait(800);
        const eCard = deck.pop();
        const eEl = getCardEl(eCard, document.body);
        eEl.style.left = '45%'; eEl.style.top = '10%';
        dealerCards.push({ data: eCard, el: eEl });
        await wait(800);
        dealerCards.forEach(c => { c.data.isFaceUp = true; c.el.classList.add('is-flipped'); });
        await wait(1500);

        const pVal = pCard.number * 2 + (pCard.color === 'black' ? 0 : 1);
        const eVal = eCard.number * 2 + (eCard.color === 'black' ? 0 : 1);
        turn = (pVal < eVal) ? 'player' : 'enemy';

        UI.log.innerText = `${turn === 'player' ? 'あなた' : '相手'}の先行です！`;
        await wait(1500);
        dealerCards.forEach(c => c.el.remove());
        dealerCards = [];
        phase = 'SETUP';
        deck = createDeck();
        for (let i = 0; i < 4; i++) {
          playerHand.push(deck.pop());
          enemyHand.push(deck.pop());
          updateDeckVisual();
          updateHandUI({ enemyReverse: false });
          await wait(300);
        }
        sortHand(playerHand);
        sortHand(enemyHand);
        updateHandUI();
        init_game();
        updateAdvantages();
        if (turn === 'player') { phase = 'TURN_START'; UI.log.innerText = "山札をタップしてドロー"; }
        else { enemyTurn(); }
      } else if (phase === 'TURN_START' && turn === 'player') {
        unsettledCard = deck.pop();
        updateDeckVisual();
        phase = 'DRAWN';
        updateHandUI();
        UI.log.innerText = "カードをドラッグしてアタック";
      }
    }

    UI.attackBtn.onclick = async () => {
      const guess = parseInt(UI.guessInput.value);
      if (isNaN(guess)) return;
      UI.controls.classList.add('hidden');
      UI.guessInput.value = '';
      if (targetCard.number === guess) {
        UI.log.innerText = "的中！";
        targetCard.isFaceUp = true;
        document.getElementById(targetCard.id).classList.remove('target-highlight');
        updateHandUI();
        updateAdvantages();
        await wait(1000);
        checkWin();
        if (phase !== 'GAMEOVER') {
          UI.log.innerText = "続行するか、ステイしてください";
          UI.stayBtn.classList.remove('hidden');
          UI.controls.classList.remove('hidden');
          phase = 'DRAWN';
        }
      } else {
        UI.log.innerText = `失敗...`;
        unsettledCard.isFaceUp = true;
        document.getElementById(targetCard.id).classList.remove('target-highlight');
        updateHandUI();
        await wait(1200);
        await settleCardAnimation();
        updateAdvantages();
        endTurn();
      }
    };

    UI.stayBtn.onclick = async () => {
      UI.stayBtn.classList.add('hidden');
      UI.controls.classList.add('hidden');
      await settleCardAnimation();
      updateAdvantages();
      endTurn();
    };

    // 場にある未確定カードを、現在のターンの持ち主の手札の正しい並び順へアニメーションさせて格納する
    async function settleCardAnimation() {
      if (!unsettledCard) return;
      const isPlayer = (turn === 'player');
      const hand = isPlayer ? playerHand : enemyHand;
      const inner = isPlayer ? UI.playerInner : UI.enemyInner;

      const insertIdx = getSortIndex(hand, unsettledCard, isPlayer);
      const options = isPlayer ? { playerOffset: true, playerOffsetIdx: insertIdx, isSettling: true } : { enemyOffset: true, enemyOffsetIdx: insertIdx, isSettling: true };

      updateHandUI({ enemyReverse: true, ...options });
      await wait(100);

      const el = document.getElementById(unsettledCard.id);
      const baseCardW = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--card-w'));
      const gap = 6;
      const targetX = 20 + (insertIdx * (baseCardW + gap));

      inner.appendChild(el);
      el.style.left = `${targetX}px`;
      el.style.top = '12px';
      await wait(600);

      hand.push(unsettledCard);
      sortHand(hand);
      unsettledCard = null;
      updateHandUI();
    }

    function endTurn() {
      targetCard = null;
      updateHandUI();
      if (phase !== 'GAMEOVER') {
        turn = 'enemy';
        enemyTurn();
      }
    }

    async function enemyTurn(card, action) {
      if (phase === 'GAMEOVER') return;
      phase = 'ENEMY_TURN';
      UI.log.innerText = "相手のターンです...";
      await wait(1200);
      const eDraw = card ?? deck.pop();
      unsettledCard = eDraw;
      updateDeckVisual();

      const eEl = getCardEl(eDraw, document.body);
      const spotRect = UI.spot.getBoundingClientRect();
      eEl.style.left = `${spotRect.left}px`;
      eEl.style.top = `${spotRect.top}px`;
      await wait(1000);

      const selectedAction = action ?? next_ai({
        currentPlayerId: -1,
        currentEnemyId: 1,
        playerHands: { [1]: playerHand, [-1]: enemyHand },
        deck: deck.deck(),
      }, eDraw)
      const tEl = document.getElementById(selectedAction.targetCard.id);
      const tRect = tEl.getBoundingClientRect();
      eEl.style.left = `${tRect.left}px`;
      eEl.style.top = `${tRect.top - tRect.height - 20}px`;
      await wait(1200);
      UI.log.innerText = `相手の宣言: ${selectedAction.targetNumber}`;
      await wait(1000);

      let enemyStay = true;
      let nextAction = undefined;
      if (selectedAction.targetCard.number === selectedAction.targetNumber) {
        UI.log.innerText = "的中されました！";
        selectedAction.targetCard.isFaceUp = true;
        updateAdvantages();
        updateHandUI();
        await wait(1200);

        nextAction = next_ai({ currentPlayerId: -1, currentEnemyId: 1, playerHands: { [1]: playerHand, [-1]: enemyHand }, deck: deck.deck(), }, eDraw, false);
        if (nextAction.type !== "stay") {
          UI.log.innerText = "再アタック";
          enemyStay = false;
        } else {
          UI.log.innerText = "ステイします";
        }
      } else {
        UI.log.innerText = "相手は失敗しました";
        eDraw.isFaceUp = true;
        eEl.classList.add('is-flipped');
        await wait(1200);
        await settleCardAnimation();
      }

      checkWin();
      if (phase !== 'GAMEOVER' && enemyStay) {
        await settleCardAnimation();
        updateAdvantages();
        turn = 'player';
        phase = 'TURN_START';
        UI.log.innerText = "山札をタップしてドロー";
      }
      if (enemyStay === false) {
        setTimeout(() => { enemyTurn(eDraw, nextAction) }, 1);
      }
    }

    function checkWin() {
      if (enemyHand.every(c => c.isFaceUp)) {
        UI.log.innerText = "あなたの勝利です！";
        phase = 'GAMEOVER';
        UI.ai_advantage.style.height = `0%`;
        UI.ai_advantage.textContent = "";
      }
      else if (playerHand.every(c => c.isFaceUp)) {
        UI.log.innerText = "相手の勝利です...";
        phase = 'GAMEOVER';
        UI.ai_advantage.style.height = `100%`;
        UI.human_advantage.textContent = "";
      }
    }

    function wait(ms) { return new Promise(res => setTimeout(res, ms)); }
    adjustCardSizes();
    deck = createDeck();
    updateDeckVisual();
    UI.deckBtn.onclick = onDeckClick;
    UI.deckBtn.addEventListener('touchstart', (e) => { e.preventDefault(); onDeckClick(); }, { passive: false });
    window.onresize = () => { adjustCardSizes(); updateHandUI(); };
  </script>
</body>

</html>
